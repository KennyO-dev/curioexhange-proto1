<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CurioExchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--bg2:#101010;--el:#151515;--bd:#292620;--gold:#C6A45C;--ch:#E3CD96;--dk:#806735;--tx:#F1EEE7;--tx2:#A5A29B;--tx3:#706F6A;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(ellipse at 50% 30%,#14110a 0,var(--bg) 60%);color:var(--tx);font:15px/1.6 var(--sans);overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%}
a{color:var(--ch)}button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.logo{display:inline-flex;align-items:center;gap:.5rem;font:600 1.5rem var(--serif);letter-spacing:.04em;color:var(--tx);background:none;border:0;cursor:pointer}
.logo svg{width:28px;height:28px}
#top{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:5;display:none;gap:.6rem;align-items:center;padding:.6rem 1rem;background:linear-gradient(#080808 60%,transparent);flex-wrap:wrap}
body.in #top{display:flex}#top input{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--bd);border-radius:2px;padding:.45rem .7rem}
.btn{background:none;border:1px solid var(--dk);color:var(--ch);padding:.45rem .9rem;border-radius:2px;cursor:pointer}.btn:hover{border-color:var(--gold);background:#1a160c}
.btn.pri{background:var(--gold);color:#080808;border-color:var(--gold);font-weight:500}.btn.pri:hover{background:var(--ch)}
.lk{background:none;border:0;color:var(--tx2);cursor:pointer;text-decoration:underline;padding:.2rem}
#intro{position:fixed;inset:0;z-index:4}
#wm{position:absolute;top:6vh;width:100%;text-align:center;opacity:0;transition:opacity 2s}
#wm .logo{font-size:clamp(1.8rem,5vw,2.6rem);cursor:default}#wm .logo svg{width:40px;height:40px}
#pr{position:absolute;left:0;right:0;top:62%;display:flex;flex-direction:column;align-items:center;gap:.4rem;opacity:0;transition:opacity 1.6s}
.pm{background:none;border:0;border-bottom:1px solid transparent;font:500 clamp(1.5rem,5vw,2.1rem) var(--serif);color:var(--tx2);padding:.4rem .6rem;cursor:pointer;transition:color .3s,border-color .3s}
.pm:hover,.pm:focus-visible,.pm:active{color:var(--tx);border-bottom-color:var(--gold)}
@media(min-width:900px){#pr{top:40%;flex-direction:row;justify-content:space-between;padding:0 max(4vw,calc(50% - 560px))}}
#skip{position:absolute;bottom:3vh;right:1.5rem}.show{opacity:1!important}
#panel{position:fixed;inset:0;z-index:3;overflow:auto;padding:70px 1rem 4rem;display:none}body.in #panel{display:block}
.w{max-width:760px;margin:0 auto}
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.15;margin:.2em 0 .4em}h1{font-size:clamp(1.9rem,6vw,2.7rem)}h2{font-size:1.5rem}
.sub{color:var(--tx2)}.tag{display:inline-block;border:1px solid var(--bd);color:var(--tx2);border-radius:20px;padding:0 .6rem;font-size:.8rem;margin:0 .3rem .3rem 0;background:none;cursor:pointer}.tag.on{border-color:var(--gold);color:var(--ch)}
.row{padding:1rem 0;border-bottom:1px solid var(--bd);cursor:pointer;display:block;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}.row:hover h3{color:var(--ch)}
.row h3{margin:0;font:600 1.3rem var(--serif)}.meta{color:var(--tx3);font-size:.82rem}.demo{color:var(--dk);font-size:.75rem;border:1px solid var(--dk);border-radius:2px;padding:0 .3rem;margin-left:.3rem}
label{display:block;margin:.9rem 0 .25rem;color:var(--tx2);font-size:.85rem}
.in-f{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:2px;padding:.6rem .7rem;color:var(--tx)}.in-f:focus{border-color:var(--gold)}
.err{color:#e0907a;min-height:1.4em;margin:.5rem 0}
.bar{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
.sec{background:rgba(16,16,16,.88);border:1px solid var(--bd);padding:1rem;margin:1rem 0;border-radius:2px}
#panel.cm{pointer-events:none;overflow:hidden;padding:64px 1rem 1rem}@media(max-width:700px){#panel.cm{padding-top:112px}}.hd.off #hdc{display:none}.hd.off{background:none;border:0;padding:0;backdrop-filter:none}.tg{font-size:.85rem;color:var(--tx3)}.hint button{pointer-events:auto}#cv{touch-action:none}#intro{pointer-events:none}#intro button{pointer-events:auto}#hands{position:fixed;left:0;top:0;width:524px;height:658px;transform-origin:268px 255px;pointer-events:none;opacity:0;mix-blend-mode:screen;display:none;will-change:transform}#hands img{position:absolute;max-width:none}#hT{left:112px;top:10px;transform-origin:156px 245px}#hB{left:64px;top:157px;transform-origin:204px 98px}@media(max-width:899px){#pr{top:67%}}#mute{position:fixed;right:.7rem;bottom:calc(.7rem + env(safe-area-inset-bottom,0px));z-index:6;font-size:.8rem;color:var(--tx2);background:rgba(8,8,8,.6);padding:.3rem .7rem;border:1px solid var(--bd);border-radius:20px;text-decoration:none}#panel.cm .w{max-width:none;height:100%;position:relative;margin:0}.hd{pointer-events:auto;max-width:440px;background:rgba(8,8,8,.62);padding:.7rem .9rem;border:1px solid var(--bd);border-radius:2px;backdrop-filter:blur(6px)}.hd h1{font-size:1.45rem;margin:.1em 0 .2em}.hd .btn{padding:.25rem .6rem;font-size:.8rem}.sheet{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);max-height:48vh;overflow:auto;background:rgba(10,10,10,.84);border:1px solid var(--dk);padding:1rem;backdrop-filter:blur(8px)}.sheet[hidden],.hint[hidden]{display:none}.hint{position:absolute;bottom:.5rem;left:0;right:0;text-align:center;color:var(--tx3);font-size:.85rem;margin:0}.sr{pointer-events:auto;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.sr:focus-within{width:auto;height:auto;clip:auto;left:0;bottom:2rem;background:#080808;padding:.5rem}
#map{transform:perspective(1100px) rotateX(16deg);transform-origin:50% 100%;width:100%;height:min(56vh,440px);background:rgba(8,8,8,.6);border:1px solid var(--bd);touch-action:none;cursor:grab;display:block}
.ln{stroke:var(--dk);stroke-width:1;opacity:.6;fill:none}.ln.on{stroke:var(--ch);opacity:1;stroke-width:2}
.nd{cursor:pointer}.nd circle{fill:#1c170c;stroke:var(--gold);stroke-width:1.2}.nd.sel circle{fill:var(--ch);filter:drop-shadow(0 0 6px var(--gold))}
.nd.lf circle{stroke:var(--tx2);fill:#111}.nd text{fill:var(--tx);font-size:11px;text-anchor:middle;paint-order:stroke;stroke:#080808;stroke-width:3px}
.cn circle{fill:var(--ch);stroke:var(--gold);stroke-width:3;filter:drop-shadow(0 0 10px var(--gold))}
.gr{animation:g 1.3s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:center}.ln.gr{stroke-dasharray:400;animation:d 1.3s both}
@keyframes g{from{opacity:0;transform:scale(.1)}}@keyframes d{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
#tip{position:fixed;z-index:9;max-width:260px;background:var(--el);border:1px solid var(--dk);padding:.6rem .8rem;font-size:.85rem;pointer-events:none;display:none}
#toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--el);border:1px solid var(--gold);padding:.6rem 1rem;z-index:10;display:none}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}ul.ol{list-style:none;padding-left:1.1rem;border-left:1px solid var(--bd);margin:.3rem 0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
